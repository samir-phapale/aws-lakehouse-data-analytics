# Apply stage: applies the approved tfplan from the Plan artifact. If the state changed since the
# plan was made Terraform refuses it; re-run the pipeline.
version: 0.2

env:
  variables:
    # Must match plan.yml: a plan file only applies with the Terraform version that made it
    TERRAFORM_VERSION: "1.15.4"
    TERRAFORM_SHA256: "a71695fa6db9344db02ff1adb69cce891c1b2b4dc31c08df0dd4a12101a33b26"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

phases:
  install:
    commands:
      - cd /tmp
      - curl -sSfLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
      - unzip -o -q terraform.zip -d /usr/local/bin
      - terraform version

  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/infrastructure/terraform"
      - test -f tfplan
      # readonly: use exactly the providers the plan was made with (lock file is in the artifact)
      - >-
        terraform init -lockfile=readonly
        -backend-config="bucket=${TF_STATE_BUCKET}"
        -backend-config="key=${TF_STATE_KEY}"
        -backend-config="region=${TF_STATE_REGION}"
        -backend-config="encrypt=true"
        -backend-config="use_lockfile=true"
      - terraform apply -input=false tfplan
