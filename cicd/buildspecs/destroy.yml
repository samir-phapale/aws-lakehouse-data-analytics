# Manual destroy of the main root (not a pipeline stage). Refuses to run unless started with:
#   aws codebuild start-build --project-name lakehouse-dev-destroy \
#     --environment-variables-override name=CONFIRM_DESTROY,value=lakehouse-dev,type=PLAINTEXT
version: 0.2

env:
  variables:
    # Same version as plan.yml/apply.yml (must be >= the one that last wrote the state)
    TERRAFORM_VERSION: "1.15.4"
    TERRAFORM_SHA256: "a71695fa6db9344db02ff1adb69cce891c1b2b4dc31c08df0dd4a12101a33b26"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    CONFIRM_DESTROY: ""

phases:
  install:
    commands:
      - |
        if [ "${CONFIRM_DESTROY}" != "${EXPECTED_CONFIRM}" ]; then
          echo "Refusing to destroy: start the build with CONFIRM_DESTROY=${EXPECTED_CONFIRM}"
          exit 1
        fi
      - cd /tmp
      - curl -sSfLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
      - unzip -o -q terraform.zip -d /usr/local/bin
      - terraform version

  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR}/infrastructure/terraform"
      - >-
        terraform init -lockfile=readonly
        -backend-config="bucket=${TF_STATE_BUCKET}"
        -backend-config="key=${TF_STATE_KEY}"
        -backend-config="region=${TF_STATE_REGION}"
        -backend-config="encrypt=true"
        -backend-config="use_lockfile=true"
      - terraform destroy -auto-approve -input=false -var-file="${TF_VAR_FILE}"
